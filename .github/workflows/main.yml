name: Build Huda School APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Clear Flet cache
        run: rm -rf ~/.flet/cache
      - name: Download Arabic font (Amiri)
        run: |
          mkdir -p assets
          curl -L -o assets/Amiri-Regular.ttf https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Regular.ttf
          cp assets/Amiri-Regular.ttf Amiri-Regular.ttf
          ls -la assets Amiri-Regular.ttf
      - name: Build Android APK
        run: yes | flet build apk --arch arm64-v8a --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huda-school-apk
          path: build/apk/*.apk
          if-no-files-found: error
