name: Build Huda School APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Force flet version in pyproject
        run: |
          sed -i -E 's/"flet(>=[^"]*|==[^"]*)?"/"flet==0.28.3"/' pyproject.toml
          echo "---- pyproject.toml ----"
          cat pyproject.toml
          grep -q '"flet==0.28.3"' pyproject.toml

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install "flet==0.28.3" "flet-cli==0.28.3"
          pip show flet

      - name: Build Android APK
        run: flet build apk --arch arm64-v8a --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huda-school-apk-${{ github.run_number }}
          path: build/apk/*.apk
          if-no-files-found: error
